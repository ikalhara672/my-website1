<!doctype html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahinda College · Commerce LMS</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--m:#6b1020;--m2:#8c1a2e;--g:#c8993a;--bg:#f3f5f7;--ink:#1e1a1c;--mut:#6b6569;--c:#fff;--r:14px}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Figtree,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Spectral,serif;line-height:1.2;margin:0 0 .5em}
.hide{display:none!important}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:99px;padding:.6em 1.4em;background:var(--m);color:#fff;cursor:pointer;transition:background .4s,transform .4s}
.btn:hover{background:var(--m2);transform:translateY(-1px)}.btn.alt{background:transparent;color:var(--m);border:1.5px solid var(--m)}
.btn.gold{background:var(--g);color:#2a1a00}
input,select,textarea{width:100%;padding:.65em .8em;border:1.5px solid #d9d4d6;border-radius:10px;margin:.25em 0 .8em;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--g);outline-offset:1px}
/* loader */
#loader{position:fixed;inset:0;background:var(--m);color:#fff;display:grid;place-items:center;z-index:99;transition:opacity 1s,visibility 1s;text-align:center}
#loader.out{opacity:0;visibility:hidden}
.ring{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--g);margin:0 auto 1.2rem;animation:spin 2.4s linear infinite}
#loader h1{font-size:1.7rem;animation:fade 1.6s ease both}#loader p{color:var(--g);animation:fade 2s .4s ease both}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* nav + landing */
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.8rem 5vw;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid #e6e1e3}
nav b{font-family:Spectral,serif;color:var(--m);font-size:1.15rem}nav div{display:flex;gap:.6rem}
.hero{position:relative;overflow:hidden;padding:12vh 5vw 10vh;background:linear-gradient(160deg,var(--m),#3d0a14);color:#fff}
.hero:before{content:"";position:absolute;width:520px;height:520px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(200,153,58,.45),transparent 70%);animation:float 12s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(-60px,50px) scale(1.15)}}
.hero h1{font-size:clamp(2rem,6vw,3.8rem);max-width:15ch;position:relative}.hero p{max-width:55ch;color:#f1dfe2;position:relative}
.hero .btn{position:relative;margin-right:.5rem}
section.s{padding:7vh 5vw;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.card{background:var(--c);border-radius:var(--r);padding:1.2rem;border:1px solid #e8e3e5}
.card.l{border-left:4px solid var(--g)}
.mut{color:var(--mut);font-size:.9rem}
footer{padding:2rem 5vw;text-align:center;color:var(--mut)}footer a{color:var(--m)}
#banner{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:#fff8e6;border:1.5px solid var(--g);padding:.8rem 1.2rem;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);max-width:92vw;animation:fade .9s both}
/* modal */
#modal{position:fixed;inset:0;background:rgba(30,10,15,.55);display:grid;place-items:center;z-index:30;padding:1rem;animation:fade .5s both}
#modal .card{width:min(440px,100%);max-height:92vh;overflow:auto}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.tabs .btn{flex:1}
.err{color:#b00020;font-size:.9rem;min-height:1.2em}
/* LMS */
#lms{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--m);color:#fff;padding:1.4rem 1rem;position:sticky;top:0;height:100vh}
aside h3{color:var(--g)}aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#f1dfe2;padding:.65rem .8rem;border-radius:10px;cursor:pointer;transition:background .4s}
aside button:hover,aside button.on{background:rgba(255,255,255,.14);color:#fff}
main{padding:2rem 4vw}.pane{animation:fade .7s both}
@media(max-width:760px){#lms{grid-template-columns:1fr}aside{position:static;height:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div id="loader"><div><div class="ring"></div><h1>Mahinda College</h1><p>Commerce Section · LMS</p></div></div>

<div id="site">
<nav><b>Mahinda College · Commerce</b><div id="navbtns"></div></nav>
<header class="hero"><h1 id="t">Commerce Section</h1><p id="tag"></p>
<span id="heroBtns"></span></header>
<section class="s"><h2>අප ගැන · About us</h2><p id="about"></p></section>
<section class="s"><h2>Streams</h2><div class="grid" id="streams"></div></section>
<section class="s"><h2>Notices</h2><div class="grid" id="notices"></div></section>
<footer><span id="contact"></span><br><a href="admin.html">Admin panel</a></footer>
</div>

<div id="lms" class="hide">
<aside><h3>Commerce LMS</h3><div id="who" class="mut" style="color:#f1dfe2"></div><br>
<button data-t="lessons" class="on">Lessons</button><button data-t="notices">Notices</button><button data-t="profile">My profile</button>
<button id="toSite">Visiting page</button><button id="out">Log out</button></aside>
<main><div id="pane" class="pane"></div></main></div>

<div id="banner" class="hide"></div>
<div id="modal" class="hide"><div class="card">
<div class="tabs"><button class="btn" id="tL">Login</button><button class="btn alt" id="tR">Register</button></div>
<form id="f" onsubmit="return false">
<div id="rOnly" class="hide">
<label>I am a</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select>
<label>Full name</label><input id="name">
<div id="stuF"><label>Student ID (auto)</label><input id="sid" readonly><label>Grade</label>
<select id="grade"><option>10</option><option>11</option><option selected>12</option><option>13</option></select></div>
<div id="teaF" class="hide"><label>Subject</label><input id="subj" placeholder="Accounting / Economics / Business Studies"></div></div>
<label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password" minlength="6">
<div class="err" id="err"></div>
<button class="btn" id="go" style="width:100%">Login</button>
<button type="button" class="btn alt" id="x" style="width:100%;margin-top:.5rem">Close</button></form></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,collection,getDocs,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// === PASTE YOUR FIREBASE CONFIG (Project settings > Your apps > Web) ===
const cfg={apiKey:"AIzaSyBwsXxjjwtOg_iYG12txuVuyg5q0sAxW1o",authDomain:"mccs-d7aa9.firebaseapp.com",projectId:"mccs-d7aa9",storageBucket:"mccs-d7aa9.firebasestorage.app",messagingSenderId:"1095138498376",appId:"1:1095138498376:web:80fe1cd40cfe0078a9857d"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,mode="login",tab="lessons";
setTimeout(()=>$("loader").classList.add("out"),2200);

// public content
const D={title:"Commerce Section",tagline:"Accounting, Business Studies and Economics at Mahinda College, Galle.",about:"Our commerce section prepares students for the G.C.E. Advanced Level with dedicated teachers and a learning space that is open any time.",contact:"Mahinda College, Galle, Sri Lanka",streams:"Accounting\nBusiness Studies\nEconomics\nBusiness Statistics & ICT"};
async function loadSite(){let s=D;try{const d=await getDoc(doc(db,"content","site"));if(d.exists())s={...D,...d.data()}}catch(e){}
$("t").textContent=s.title;$("tag").textContent=s.tagline;$("about").textContent=s.about;$("contact").textContent=s.contact;
$("streams").innerHTML=s.streams.split("\n").filter(Boolean).map(x=>`<div class="card l"><h3>${esc(x)}</h3></div>`).join("");
try{const n=await getDocs(collection(db,"notices"));const a=n.docs.map(d=>d.data()).sort((x,y)=>y.at-x.at);
$("notices").innerHTML=a.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></div>`).join("")||'<p class="mut">No notices yet.</p>'}catch(e){}}
loadSite();

// modal
const setMode=m=>{mode=m;$("rOnly").classList.toggle("hide",m=="login");$("go").textContent=m=="login"?"Login":"Register";
$("tL").className="btn"+(m=="login"?"":" alt");$("tR").className="btn"+(m=="reg"?"":" alt");$("err").textContent="";if(m=="reg")previewId()};
const open=m=>{setMode(m);$("modal").classList.remove("hide")};
$("x").onclick=()=>$("modal").classList.add("hide");$("tL").onclick=()=>setMode("login");$("tR").onclick=()=>setMode("reg");
$("role").onchange=e=>{$("stuF").classList.toggle("hide",e.target.value!="student");$("teaF").classList.toggle("hide",e.target.value!="teacher")};
const nextId=n=>`MC-COM-${new Date().getFullYear()}-${String(n).padStart(4,"0")}`;
async function previewId(){try{const d=await getDoc(doc(db,"meta","counter"));$("sid").value=nextId((d.exists()?d.data().n:0)+1)}catch(e){$("sid").value="Assigned on register"}}

$("go").onclick=async()=>{$("err").textContent="";const em=$("em").value.trim(),pw=$("pw").value;
try{if(mode=="login"){await signInWithEmailAndPassword(auth,em,pw)}
else{const name=$("name").value.trim(),role=$("role").value;if(!name)throw{message:"Enter your full name"};
const c=await createUserWithEmailAndPassword(auth,em,pw);let sid="";
if(role=="student")sid=await runTransaction(db,async t=>{const r=doc(db,"meta","counter"),s=await t.get(r),n=(s.exists()?s.data().n:0)+1;t.set(r,{n});return nextId(n)});
await setDoc(doc(db,"users",c.user.uid),{name,email:em,role,grade:role=="student"?$("grade").value:"",studentId:sid,subject:role=="teacher"?$("subj").value:"",status:"pending",created:Date.now()});
me=null;await boot(c.user)}
$("modal").classList.add("hide")}catch(e){$("err").textContent=(e.message||"Error").replace("Firebase: ","")}};

// auth state
const banner=(h)=>{$("banner").innerHTML=h;$("banner").classList.toggle("hide",!h)};
async function boot(u){me=null;
if(u){const d=await getDoc(doc(db,"users",u.uid));me=d.exists()?{id:u.uid,...d.data()}:null}
$("navbtns").innerHTML=me?`<span class="mut" style="align-self:center">${esc(me.name)}</span><button class="btn alt" id="lo">Log out</button>`:`<button class="btn alt" id="nl">Login</button><button class="btn" id="nr">Register</button>`;
$("heroBtns").innerHTML=me?"":`<button class="btn gold" id="hr">Register</button><button class="btn alt" style="color:#fff;border-color:#fff" id="hl">Login</button>`;
const w=(i,f)=>$(i)&&($(i).onclick=f);w("nl",()=>open("login"));w("nr",()=>open("reg"));w("hr",()=>open("reg"));w("hl",()=>open("login"));w("lo",()=>signOut(auth));
const ok=me&&(me.status=="approved"||me.role=="admin");
$("site").classList.toggle("hide",!!ok);$("lms").classList.toggle("hide",!ok);
if(me&&!ok)banner(me.status=="rejected"?"❌ Your request was declined. Please contact the school.":"⏳ <b>Wait to accept.</b> Your account is waiting for admin approval. You can keep browsing this page.");
else banner("");
if(ok){$("who").innerHTML=`${esc(me.name)}<br>${me.role=="teacher"?"Teacher":me.role=="admin"?"Admin":"Student · Grade "+esc(me.grade)}`;render()}}
onAuthStateChanged(auth,boot);
$("out").onclick=()=>signOut(auth);$("toSite").onclick=()=>{$("lms").classList.add("hide");$("site").classList.remove("hide");window.scrollTo(0,0);
$("navbtns").innerHTML='<button class="btn" id="bk">Back to LMS</button>';$("bk").onclick=()=>{$("site").classList.add("hide");$("lms").classList.remove("hide");boot(auth.currentUser)}};
document.querySelectorAll("aside [data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("aside [data-t]").forEach(x=>x.classList.toggle("on",x==b));render()});

// LMS panes
async function render(){const p=$("pane");p.style.animation="none";p.offsetHeight;p.style.animation="";
if(tab=="profile"){p.innerHTML=`<h2>My profile</h2><div class="card"><p><b>Name:</b> ${esc(me.name)}</p><p><b>Email:</b> ${esc(me.email)}</p>${me.role=="student"?`<p><b>Student ID:</b> ${esc(me.studentId)}</p><p><b>Grade:</b> ${esc(me.grade)}</p>`:`<p><b>Subject:</b> ${esc(me.subject)}</p>`}</div>`;return}
if(tab=="notices"){const n=(await getDocs(collection(db,"notices"))).docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);
p.innerHTML="<h2>Notices</h2>"+(n.map(x=>`<div class="card l" style="margin-bottom:.8rem"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></div>`).join("")||'<p class="mut">No notices.</p>');return}
const all=(await getDocs(collection(db,"lessons"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);
const L=all.filter(x=>me.role!="student"||x.grade=="all"||x.grade==me.grade);
const form=me.role=="student"?"":`<div class="card" style="margin-bottom:1rem"><h3>Add a lesson</h3><input id="lt" placeholder="Title"><textarea id="ld" placeholder="Description"></textarea><input id="ll" placeholder="Link (YouTube / Drive / PDF)"><select id="lg"><option value="all">All grades</option><option>10</option><option>11</option><option>12</option><option>13</option></select><button class="btn" id="la">Publish</button></div>`;
p.innerHTML=`<h2>Lessons</h2>${form}<div class="grid">${L.map(x=>`<div class="card l"><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><p class="mut">Grade ${esc(x.grade)} · ${esc(x.by)}</p>${x.link?`<a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${esc(x.link)}">Open</a>`:""}${me.role!="student"&&(x.uid==me.id||me.role=="admin")?` <button class="btn alt" data-del="${x.id}">Delete</button>`:""}</div>`).join("")||'<p class="mut">No lessons yet.</p>'}</div>`;
if($("la"))$("la").onclick=async()=>{if(!$("lt").value)return;await addDoc(collection(db,"lessons"),{title:$("lt").value,desc:$("ld").value,link:$("ll").value,grade:$("lg").value,by:me.name,uid:me.id,at:Date.now()});render()};
p.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"lessons",b.dataset.del));render()})}
</script></body></html>
