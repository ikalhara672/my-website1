<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--g:#c8993a;--gd:#9a7420;--gl:#fbf3de;--bg:#fcfbf7;--ink:#2b2820;--mut:#7a7466;--c:#fff;--bd:#efe9d8}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Figtree,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Spectral,serif;line-height:1.2;margin:0 0 .5em}.hide{display:none!important}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:99px;padding:.55em 1.3em;background:var(--g);color:#fff;cursor:pointer;transition:.25s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--gd);transform:translateY(-1px)}.btn.alt{background:transparent;color:var(--gd);border:1.5px solid var(--g)}.btn.alt:hover{background:var(--gl)}
.btn.sm{padding:.3em .9em;font-size:.88rem}.btn.red{background:#b3261e}
input,select,textarea{width:100%;padding:.6em .8em;border:1.5px solid var(--bd);border-radius:10px;margin:.2em 0 .7em;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid #e9d29b}
.card{background:var(--c);border-radius:14px;padding:1.1rem;border:1px solid var(--bd);box-shadow:0 2px 10px rgba(154,116,32,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.mut{color:var(--mut);font-size:.9rem}.err{color:#b3261e;font-size:.9rem;min-height:1.2em}
.tag{display:inline-block;padding:.1em .7em;border-radius:99px;font-size:.75rem;background:var(--gl);color:var(--gd);margin-right:.3rem}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--gl);color:var(--gd);display:inline-grid;place-items:center;font-weight:700;border:2px solid var(--g);flex:none}
.who{display:flex;gap:.8rem;align-items:center}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.row>input,.row>select{width:auto;flex:1;min-width:140px;margin:0}
.modal{position:fixed;inset:0;background:rgba(43,40,32,.45);display:grid;place-items:center;z-index:30;padding:1rem;overflow:auto}
.modal .card{width:min(480px,100%);max-height:94vh;overflow:auto}
aside{background:#fff;border-right:1px solid var(--bd);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;z-index:40;transition:left .3s}
aside img.cr{width:64px;display:block;margin:0 auto .4rem}aside h3{color:var(--gd);text-align:center}
aside button{display:block;width:100%;text-align:left;background:none;border:0;padding:.6rem .8rem;border-radius:10px;cursor:pointer;color:var(--ink)}
aside button:hover,aside button.on{background:var(--gl);color:var(--gd)}
main{padding:1.6rem 3vw;min-width:0}.ham{display:none;position:fixed;top:10px;left:10px;z-index:50;background:var(--g);color:#fff;border:0;width:44px;height:44px;border-radius:12px;font-size:1.3rem}
@media(max-width:760px){.ham{display:block}aside{position:fixed;left:-280px;width:260px}aside.open{left:0}main{padding:4rem 1rem 2rem}}
.chips button{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:.3em .9em;cursor:pointer}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#loader{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:99;transition:opacity 1s,visibility 1s;text-align:center}#loader.out{opacity:0;visibility:hidden}
#loader img{width:150px;animation:fade 1.4s both}.bar{width:120px;height:3px;background:var(--bd);margin:1rem auto;overflow:hidden;border-radius:3px}.bar i{display:block;height:100%;width:40%;background:var(--g);animation:slide 1.2s infinite}
@keyframes slide{from{margin-left:-40%}to{margin-left:100%}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.6rem 5vw;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
nav b{font-family:Spectral,serif;color:var(--gd);display:flex;align-items:center;gap:.6rem}nav img{height:40px}
.hero{padding:11vh 5vw 9vh;background:linear-gradient(160deg,#fff,var(--gl));text-align:center;border-bottom:3px solid var(--g)}
.hero img{width:130px}.hero h1{font-size:clamp(2rem,6vw,3.4rem);color:var(--gd)}.hero p{max-width:55ch;margin:0 auto 1rem;color:var(--mut)}
section.s{padding:6vh 5vw;max-width:1100px;margin:auto}.card.l{border-left:4px solid var(--g)}
#banner{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:var(--gl);border:1.5px solid var(--g);padding:.8rem 1.2rem;border-radius:14px;max-width:92vw}
#lms{display:grid;grid-template-columns:230px 1fr;min-height:100vh}@media(max-width:760px){#lms{grid-template-columns:1fr}}
footer{padding:2rem;text-align:center;color:var(--mut)}footer a{color:var(--gd)}
.opt{display:flex;gap:.5rem;align-items:center;padding:.45rem .7rem;border:1.5px solid var(--bd);border-radius:10px;margin:.3rem 0;cursor:pointer}.opt input{width:auto;margin:0}.opt.ok{background:#d6f3e3;border-color:#1f7a4d}.opt.bad{background:#fbd5da;border-color:#b3261e}.qz{margin-bottom:1rem}
html{-webkit-text-size-adjust:100%}img{max-width:100%}main{max-width:1240px;margin:auto;width:100%}aside{height:100vh;height:100dvh;overflow:auto}
@media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
@media(max-width:760px){.hero{padding:7vh 5vw}.grid{grid-template-columns:1fr}.row>input,.row>select{min-width:45%}.card{padding:.9rem}.modal{padding:.5rem}section.s{padding:4vh 4vw}}
@media(max-width:480px){nav b span{display:none}}
.chat{display:flex;flex-direction:column;gap:.6rem;padding:.8rem}.cl{height:min(60vh,520px);height:min(60dvh,520px);overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.msg{display:flex;gap:.5rem;align-items:flex-end;max-width:92%}.msg.me{align-self:flex-end;flex-direction:row-reverse}.bub{background:var(--bg);border:1px solid var(--bd);padding:.4rem .8rem;border-radius:14px;white-space:pre-wrap;word-break:break-word}.msg.me .bub{background:var(--gl)}.msg.bot .bub{background:#fff8e1;border-color:var(--g)}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99;background:#fde8e6;border:1.5px solid #b3261e;color:#7a1a14;padding:.6rem 1rem;border-radius:12px;max-width:94vw;font-size:.9rem}
.cvi{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--gl)}.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--gl)}
.hero{position:relative;overflow:hidden}.hero>*:not(.bgs){position:relative;z-index:2}.bgs{position:absolute;inset:0;z-index:0}.bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s}.bgs img.on{opacity:1}.hero.hasbg:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(255,255,255,.62),rgba(251,243,222,.78))}
</style></head><body>
